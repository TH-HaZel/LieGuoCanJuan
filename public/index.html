<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>列国残卷</title><link rel="stylesheet" href="/style.css"></head><body><header><b>列国残卷</b><span>玩家与房间测试</span></header><main><section id="lobby"><h1>🎴 创建或加入房间</h1><label>玩家昵称<input id="name" maxlength="20" placeholder="输入昵称"></label><div class="row"><button id="create">创建房间</button><input id="roomInput" maxlength="6" placeholder="输入房间号"><button id="join">加入房间</button></div><p id="error" role="alert"></p></section><section id="game" hidden><div class="room-info"><span>房间号：<b id="roomCode"></b>　<span id="turn"></span></span><span id="connection">连接中</span></div><div id="opponents" class="opponents"></div><div class="middle">中立资源区</div><div class="lower"><div><h2>我的将领</h2><div id="generals">暂无将领</div></div><div><h2>事件</h2><p id="message" aria-live="polite">等待房主开始。</p></div></div><div class="bottom"><div id="self"></div><div><h2>我的手牌</h2><div id="hand">暂无手牌</div></div></div><div class="row"><button id="start" hidden>开始游戏</button><button id="endTurn" hidden>结束回合</button></div></section></main><script src="/client.js"></script></body></html>
