<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>列国残卷</title><link rel="stylesheet" href="/style.css"></head><body><header><b>列国残卷</b><span>玩家与房间测试</span></header><main><section id="lobby"><h1>🎴 创建或加入房间</h1><label>玩家昵称<input id="name" maxlength="20" placeholder="输入昵称"></label><p>唐朝测试牌组：18 张专属技能牌、20 张默认公共牌和 2 张武将牌。初始武将免费部署。</p><div class="row"><label>初始武将 <select id="initial"></select></label><label>主牌组武将 1 <select id="general1"></select></label><label>主牌组武将 2 <select id="general2"></select></label></div><div class="row"><button id="create">创建房间</button><input id="roomInput" maxlength="6" placeholder="输入房间号"><button id="join">加入房间</button></div><hr><h2>🪑 单机轮流测试</h2><p>同一台电脑轮流操作，交接时隐藏手牌。玩家分别选择武将，公共牌暂用默认组合。</p><label>玩家人数 <select id="localCount"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><div id="localPlayers"></div><button id="localStart">开始单机测试</button><p id="error" role="alert"></p></section><section id="handoff" hidden><h1>🔒 请交给 <span id="handoffName"></span></h1><p>上一位玩家的手牌已收起。</p><button id="handoffReveal">开始操作</button></section><section id="game" hidden><div class="room-info"><span>房间号：<b id="roomCode"></b>　<span id="turn"></span></span><span id="connection">连接中</span></div><div id="opponents" class="opponents"></div><div class="middle">中立资源区</div><div class="lower"><div><h2>我的将领</h2><div id="generals">暂无将领</div></div><div><h2>事件</h2><p id="message" aria-live="polite">等待房主开始。</p></div></div><div class="bottom"><div id="self"></div><div><h2>我的手牌</h2><div id="hand">暂无手牌</div></div></div><div class="row"><button id="start" hidden>开始游戏</button><button id="endTurn" hidden>结束回合</button></div></section></main><script src="/client.js"></script></body></html>
